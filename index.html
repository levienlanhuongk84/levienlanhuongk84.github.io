<html lang="vi">
<head>

<title>Học liệu Tiếng Anh</title>
<meta name="description" content="Sổ tay học phần, bài giảng, bài kiểm tra và đề thi thử Tiếng Anh — mục lục riêng để quản lý.">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#613087;--purple-2:#47206a;--orange:#DD5A28;--gold:#FCB715;
  --bg:#f7f5fa;--card:#fff;--ink:#1f1a2b;--muted:#6b6478;--line:#e6e1ee;--line-2:#d3cbe0;
  --accent:#613087;--accent-ink:#fff;--accent-soft:#efe7f6;
  --bar-bg:rgba(247,245,250,.94);--shadow:0 10px 28px rgba(97,48,135,.13);
  --t-so-tay:#613087;--t-so-tay-bg:#efe7f6;
  --t-bai-giang:#b4441a;--t-bai-giang-bg:#fdece3;
  --t-giao-an:#7d5100;--t-giao-an-bg:#fbefd0;
  --t-kiem-tra:#0d6b63;--t-kiem-tra-bg:#dcf1ee;
  --t-mock:#ad1f45;--t-mock-bg:#fae4ea;
  --t-cam-nang:#1c5aa0;--t-cam-nang-bg:#e2ecf9;
  --gv-bg:#fdf7e7;--gv-line:#e9d49b;--gv-ink:#7d5100;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15111d;--card:#1f1929;--ink:#eee9f4;--muted:#b1a7c2;--line:#342a42;--line-2:#4a3d5c;
  --accent:#FCB715;--accent-ink:#241536;--accent-soft:rgba(252,183,21,.14);
  --bar-bg:rgba(21,17,29,.92);--shadow:0 10px 28px rgba(0,0,0,.45);
  --t-so-tay:#d2b6ec;--t-so-tay-bg:rgba(151,96,200,.2);
  --t-bai-giang:#f5a883;--t-bai-giang-bg:rgba(221,90,40,.18);
  --t-giao-an:#f1c75f;--t-giao-an-bg:rgba(252,183,21,.14);
  --t-kiem-tra:#72d4c7;--t-kiem-tra-bg:rgba(20,160,145,.17);
  --t-mock:#f28ea9;--t-mock-bg:rgba(220,50,95,.17);
  --t-cam-nang:#8dbaf0;--t-cam-nang-bg:rgba(60,130,210,.19);
  --gv-bg:rgba(252,183,21,.06);--gv-line:rgba(252,183,21,.3);--gv-ink:#f1c75f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15111d;--card:#1f1929;--ink:#eee9f4;--muted:#b1a7c2;--line:#342a42;--line-2:#4a3d5c;
  --accent:#FCB715;--accent-ink:#241536;--accent-soft:rgba(252,183,21,.14);
  --bar-bg:rgba(21,17,29,.92);--shadow:0 10px 28px rgba(0,0,0,.45);
  --t-so-tay:#d2b6ec;--t-so-tay-bg:rgba(151,96,200,.2);
  --t-bai-giang:#f5a883;--t-bai-giang-bg:rgba(221,90,40,.18);
  --t-giao-an:#f1c75f;--t-giao-an-bg:rgba(252,183,21,.14);
  --t-kiem-tra:#72d4c7;--t-kiem-tra-bg:rgba(20,160,145,.17);
  --t-mock:#f28ea9;--t-mock-bg:rgba(220,50,95,.17);
  --t-cam-nang:#8dbaf0;--t-cam-nang-bg:rgba(60,130,210,.19);
  --gv-bg:rgba(252,183,21,.06);--gv-line:rgba(252,183,21,.3);--gv-ink:#f1c75f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 32px}
[hidden]{display:none!important}

/* Shell: sidebar + content pane */
.shell{display:flex;align-items:stretch;min-height:100vh}
.rail{width:272px;flex:none;background:linear-gradient(165deg,var(--purple) 0%,var(--purple-2) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;position:relative}
.rail:before{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));opacity:.35;pointer-events:none}
.rail-head{position:relative;z-index:1;padding:26px 20px 18px;display:flex;flex-direction:column;gap:10px}
.kicker{margin:0;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.rail-head h1{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.rail-nav{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 12px 8px;list-style:none;margin:0}
.rail-item-wrap+.rail-item-wrap{margin-top:2px}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:rgba(255,255,255,.85);border-radius:10px;padding:10px 10px;cursor:pointer;font:inherit}
.rail-item:hover{background:rgba(255,255,255,.09);color:#fff}
.rail-item .num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700}
.rail-item .lbl{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-item .cnt{flex:none;font-size:11.5px;opacity:.7}
.rail-item[aria-selected="true"]{background:rgba(252,183,21,.18);color:#fff}
.rail-item[aria-selected="true"] .num{background:var(--gold);color:#241536}
.rail-item.teacher .num{background:rgba(252,183,21,.35)}
.rail-item.teacher[aria-selected="true"] .num{background:var(--gold)}
.rail-sub{list-style:none;margin:2px 0 8px 42px;padding:0;display:flex;flex-direction:column;gap:1px}
.rail-sub a{display:block;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.65);text-decoration:none;padding:5px 8px;border-radius:7px}
.rail-sub a:hover{background:rgba(255,255,255,.08);color:#fff}
.rail-foot{position:relative;z-index:1;padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.14)}
.stats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.stats li{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12.5px}
.stats b{font-weight:700;color:var(--gold);margin-right:4px}

/* Content pane */
.pane{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:10;background:var(--bar-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.search{display:flex;align-items:center;gap:8px;flex:0 1 320px;min-width:0;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:0 10px;height:38px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;height:100%}
.search kbd{flex:none;font:500 11px Roboto,sans-serif;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip .n{font-size:12px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip:disabled{opacity:.4;cursor:default}

main{padding-top:20px;padding-bottom:48px;flex:1}
.group{scroll-margin-top:20px}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.group-head h2{margin:0;font-size:22px;font-weight:700;color:var(--ink)}
.group-head h2:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--orange),var(--gold));margin-right:10px;vertical-align:2px}
.group-head .gsub{margin:0;color:var(--muted);font-size:14px;flex:1;min-width:200px}
.group-head .gcount{font-size:13px;color:var(--muted);font-weight:500}
.unit{margin-top:20px;scroll-margin-top:20px}
.unit h3{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* Card */
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;color:var(--c);background:var(--cb)}
.t-so-tay{--c:var(--t-so-tay);--cb:var(--t-so-tay-bg)}
.t-bai-giang{--c:var(--t-bai-giang);--cb:var(--t-bai-giang-bg)}
.t-giao-an{--c:var(--t-giao-an);--cb:var(--t-giao-an-bg)}
.t-kiem-tra{--c:var(--t-kiem-tra);--cb:var(--t-kiem-tra-bg)}
.t-mock{--c:var(--t-mock);--cb:var(--t-mock-bg)}
.t-cam-nang{--c:var(--t-cam-nang);--cb:var(--t-cam-nang-bg)}
.card-ctx{margin:2px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gv-ink)}
.card-ctx+h4{margin-top:0}
.card h4{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.3}
.card-desc{margin:0;color:var(--muted);font-size:14px}
.eds{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.ed{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--card)}
.ed a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:500;padding:7px 10px 7px 12px}
.ed a:hover{background:var(--accent-soft)}
.ed:not(.primary) a svg{display:none}
.ed:not(.primary) a{padding-right:12px}
.ed .copy{border:0;border-left:1px solid var(--line-2);background:transparent;cursor:pointer;padding:0 9px;display:inline-flex;align-items:center;color:var(--muted)}
.ed .copy:hover{color:var(--ink);background:var(--accent-soft)}
.ed.primary{background:var(--accent);border-color:var(--accent)}
.ed.primary a,.ed.primary .copy{color:var(--accent-ink)}
.ed.primary .copy{border-left-color:rgba(255,255,255,.28)}
.ed.primary a:hover,.ed.primary .copy:hover{background:rgba(255,255,255,.14)}
.card-meta{margin:2px 0 0;font-size:12px;color:var(--muted)}
.group.teacher{padding:0 16px 20px;background:var(--gv-bg);border:1px dashed var(--gv-line);border-radius:16px}
.group.teacher .group-head{padding-top:20px;border-bottom-color:var(--gv-line)}
.group.teacher .group-head h2{color:var(--gv-ink)}
.group.teacher .unit h3{color:var(--gv-ink)}
.gvtag{font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 7px;background:var(--gv-ink);color:var(--card)}
.group.teacher .card{border-left:3px solid var(--gold)}
.empty{text-align:center;color:var(--muted);padding:48px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-top:18px;padding-bottom:28px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:899px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex-direction:column}
  .rail:before{width:160px;height:160px;right:-60px;top:-70px}
  .rail-head{padding:18px 16px 10px}
  .rail-head h1{font-size:19px}
  .rail-nav{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 12px 12px;gap:6px;scrollbar-width:none}
  .rail-nav::-webkit-scrollbar{display:none}
  .rail-item-wrap+.rail-item-wrap{margin-top:0}
  .rail-item-wrap{flex:none}
  .rail-item{flex:none;white-space:nowrap;border-radius:9px 9px 0 0;border-bottom:3px solid transparent;padding:8px 10px}
  .rail-item .lbl{max-width:160px}
  .rail-item[aria-selected="true"]{background:rgba(255,255,255,.08);border-bottom-color:var(--gold)}
  .rail-sub{display:none}
  .rail-foot{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .topbar-row{flex-wrap:wrap;gap:8px}
  .search{flex:1 1 100%;order:-1}
  .search kbd{display:none}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

ích từng bước bằng dropdown, viết, máy soát lỗi, giáo viên duyệt và trả kết quả.","upd":"29/09/2026","eds":[{"l":"Luyện tập","s":"vstep-writing-task1-practice"}],"gv":false,"ctx":null},{"k":"life-u10ab","g":"life","gt":"Life Pre-Intermediate","gs":"Life Pre-Int","unit":"Unit 10 · Products","type":"bai-giang","title":"Unit 10a–10b · Logos & Product design","desc":"Từ vựng thiết kế sản phẩm, câu bị động, used to và các cách nói thói quen trong quá khứ.","upd":"23/09/2026","eds":[{"l":"English","s":"life-pre-u10ab-logos-design-en"}],"gv":false,"ctx":null},{"k":"life-u10ab-gv","g":"gv","gt":"Life Pre-Intermediate","gs":"Life Pre-Int","unit":null,"type":"bai-giang","title":"Unit 10a–10b · Logos & Product design","desc":"Từ vựng thiết kế sản phẩm, câu bị động, used to và các cách nói thói quen trong quá khứ.","upd":"23/09/2026","eds":[{"l":"Tiếng Việt","s":"life-pre-u10ab-logos-design"},{"l":"Song ngữ","s":"life-pre-u10ab-logos-design-bi"}],"gv":true,"ctx":"Life Pre-Int · Unit 10 · Products"},{"k":"keynote6-u1","g":"ielts","gt":"IELTS","gs":"IELTS","unit":null,"type":"bai-giang","title":"Keynote 6 · Unit 1","desc":"All in a day's work — IELTS C1–C2.","upd":"29/09/2026","eds":[{"l":"Mở bài giảng","s":"keynote6_Unit_All_in_a_days_work_C1"}],"gv":false,"ctx":null}]}</script>
<script>
(function(){
  try{if('scrollRestoration' in history)history.scrollRestoration='manual';}catch(e){}
  var $=function(id){return document.getElementById(id);};
  var CAT=JSON.parse($('cat-data').textContent);
  var POSKEY='lvlh.hub.group';
  // Chặn trình duyệt tự cuộn tới #hash trước khi các section (được JS tạo sau) tồn tại.
  var initialHash=location.hash.slice(1);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  var ICON={arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var norm=function(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase();};

  function cardHtml(c){
    var eds=c.eds.map(function(e,i){
      var href='/'+e.s+'/';
      return '<div class="ed'+(i?'':' primary')+'"><a href="'+esc(href)+'">'+esc(e.l)+ICON.arrow+'</a>'
        +'<button class="copy" type="button" data-href="'+esc(href)+'" aria-label="Sao chép link: '+esc(c.title+' – '+e.l)+'" title="Sao chép link">'+ICON.copy+'</button></div>';
    }).join('');
    var q=norm([c.title,c.desc,c.unit||'',c.gt,c.gs,CAT.types[c.type],c.ctx||'',c.gv?'giao vien gv':''].concat(c.eds.map(function(e){return e.l+' '+e.s;})).join(' '));
    return '<article class="card" data-type="'+esc(c.type)+'" data-q="'+esc(q)+'">'
      +'<div class="card-top">'+(c.gv?'<span class="gvtag">GV</span>':'')+'<span class="badge t-'+esc(c.type)+'">'+esc(CAT.types[c.type])+'</span></div>'
      +(c.ctx?'<p class="card-ctx">'+esc(c.ctx)+'</p>':'')
      +'<h4>'+esc(c.title)+'</h4><p class="card-desc">'+esc(c.desc)+'</p>'
      +'<div class="eds">'+eds+'</div>'
      +'<p class="card-meta">Cập nhật '+esc(c.upd)+'</p></article>';
  }

  function render(){
    var order=CAT.groups.slice().sort(function(a,b){return a.o-b.o;});
    var html=[],navItems=[],types={},nItems=0,nTeacher=0,nLinks=0,n=0;
    order.forEach(function(g){
      var mine=CAT.cards.filter(function(c){return c.g===g.id;});
      if(!mine.length)return;
      n++;
      var parts=['<section class="group'+(g.teacher?' teacher':'')+'" id="grp-'+esc(g.id)+'"><div class="group-head"><h2>'+esc(g.title)+'</h2><p class="gsub">'+esc(g.sub)+'</p><span class="gcount"></span></div>'];
      var top=mine.filter(function(c){return !c.unit;});
      if(top.length)parts.push('<div class="grid grid-top">'+top.map(cardHtml).join('')+'</div>');
      var units=[];mine.forEach(function(c){if(c.unit&&units.indexOf(c.unit)<0)units.push(c.unit);});
      units.forEach(function(u,ui){parts.push('<div class="unit" id="'+esc(g.id)+'--u'+ui+'"><h3>'+esc(u)+'</h3><div class="grid">'+mine.filter(function(c){return c.unit===u;}).map(cardHtml).join('')+'</div></div>');});
      parts.push('</section>');html.push(parts.join(''));
      navItems.push({id:g.id,short:g.short,teacher:!!g.teacher,num:n,units:units});
      mine.forEach(function(c){types[c.type]=1;nLinks+=c.eds.length;if(c.gv)nTeacher++;else nItems++;});
    });
    $('groups').innerHTML=html.join('');
    $('railNav').innerHTML=navItems.map(function(it){
      return '<li class="rail-item-wrap" data-group="'+esc(it.id)+'">'
        +'<button type="button" class="rail-item'+(it.teacher?' teacher':'')+'" id="rt-'+esc(it.id)+'" role="tab" data-group="'+esc(it.id)+'" aria-selected="false">'
        +'<span class="num">'+it.num+'</span><span class="lbl">'+esc(it.short)+'</span><span class="cnt"></span></button>'
        +'<ul class="rail-sub" id="rs-'+esc(it.id)+'" hidden></ul></li>';
    }).join('');
    $('chips').innerHTML='<button class="chip" type="button" data-type="all" aria-pressed="true">Tất cả <span class="n"></span></button>'
      +Object.keys(CAT.types).filter(function(t){return types[t];}).map(function(t){return '<button class="chip" type="button" data-type="'+t+'" aria-pressed="false">'+esc(CAT.types[t])+' <span class="n"></span></button>';}).join('');
    $('stats').innerHTML='<li><b>'+nItems+'</b>học liệu</li>'+(nTeacher?'<li><b>'+nTeacher+'</b>bản giáo viên</li>':'')+'<li><b>'+nLinks+'</b>link</li>';
    wire(navItems);
  }

  function wire(navItems){
    var cards=[].slice.call(document.querySelectorAll('.card'));
    var chips=[].slice.call(document.querySelectorAll('.chip'));
    var tabs=[].slice.call(document.querySelectorAll('.rail-item'));
    var q=$('q'),state={type:'all',q:''},active=null;

    function subOutline(gid){
      var ul=$('rs-'+gid);if(!ul)return;
      var it=navItems.filter(function(x){return x.id===gid;})[0];
      if(!it||!it.units.length){ul.hidden=true;ul.innerHTML='';return;}
      ul.innerHTML=it.units.map(function(u,ui){return '<a href="#'+gid+'--u'+ui+'">'+esc(u)+'</a>';}).join('');
      ul.hidden=false;
    }

    function setActive(gid,opts){
      opts=opts||{};
      if(!document.getElementById('grp-'+gid))return;
      active=gid;
      document.querySelectorAll('.group').forEach(function(g){g.hidden=(g.id!=='grp-'+gid);});
      tabs.forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.group===gid));});
      requestAnimationFrame(function(){
        var activeTab=document.getElementById('rt-'+gid);if(!activeTab)return;
        var nav=$('railNav');
        if(nav.scrollWidth>nav.clientWidth+1){
          var wrap=activeTab.closest('.rail-item-wrap');
          var target=wrap.offsetLeft-(nav.clientWidth-wrap.offsetWidth)/2;
          nav.scrollTo({left:Math.max(0,target),behavior:'smooth'});
        }
      });
      document.querySelectorAll('.rail-sub').forEach(function(u){if(u.id!=='rs-'+gid){u.hidden=true;}});
      subOutline(gid);
      if(!opts.silent){q.value='';state.q='';state.type='all';
        chips.forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.type==='all'));});
      }
      apply();
      try{localStorage.setItem(POSKEY,gid);}catch(e){}
      try{history.replaceState(null,'','#'+gid);}catch(e){}
      if(opts.scroll)scrollTo(0,0);
    }

    function apply(){
      var terms=norm(state.q).split(/\s+/).filter(Boolean),counts={all:0},total=0;
      var scope=document.getElementById('grp-'+active);
      (scope?[].slice.call(scope.querySelectorAll('.card')):[]).forEach(function(c){
        var okQ=terms.every(function(t){return c.dataset.q.indexOf(t)>-1;});
        if(okQ){counts.all++;counts[c.dataset.type]=(counts[c.dataset.type]||0)+1;}
        var show=okQ&&(state.type==='all'||c.dataset.type===state.type);
        c.hidden=!show;if(show)total++;
      });
      cards.forEach(function(c){if(!scope||!scope.contains(c))c.hidden=true;});
      chips.forEach(function(ch){var n=counts[ch.dataset.type]||0;ch.querySelector('.n').textContent=n;ch.disabled=!n&&ch.dataset.type!==state.type;});
      if(scope){
        scope.querySelectorAll('.unit,.grid-top').forEach(function(u){u.hidden=!u.querySelector('.card:not([hidden])');});
        var n=scope.querySelectorAll('.card:not([hidden])').length;
        scope.querySelector('.gcount').textContent=n+' học liệu';
      }
      tabs.forEach(function(t){var g=document.getElementById('grp-'+t.dataset.group);t.querySelector('.cnt').textContent=g?g.querySelectorAll('.card').length+' học liệu':'';});
      $('empty').hidden=total>0;
    }

    tabs.forEach(function(t){t.addEventListener('click',function(){setActive(t.dataset.group,{scroll:true});});});
    chips.forEach(function(ch){ch.addEventListener('click',function(){
      state.type=ch.dataset.type;chips.forEach(function(x){x.setAttribute('aria-pressed',String(x===ch));});apply();
    });});
    q.addEventListener('input',function(){state.q=q.value;apply();});
    document.addEventListener('click',function(e){
      var a=e.target.closest('.rail-sub a');if(!a)return;
      e.preventDefault();var t=$(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
    });

    var initial=(initialHash&&document.getElementById('grp-'+initialHash))?initialHash:null;
    if(!initial){try{var saved=localStorage.getItem(POSKEY);if(saved&&document.getElementById('grp-'+saved))initial=saved;}catch(e){}}
    if(!initial&&navItems.length)initial=navItems[0].id;
    if(initial)setActive(initial,{silent:true});

    document.addEventListener('keydown',function(e){
      if(e.key==='/'&&document.activeElement!==q&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey){e.preventDefault();q.focus();}
      else if(e.key==='Escape'&&document.activeElement===q){q.value='';q.dispatchEvent(new Event('input'));q.blur();}
    });
  }

  var toast=$('toast'),tt;
  function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show');},1800);}
  function fallbackCopy(text){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.copy');if(!b)return;
    var url=new URL(b.dataset.href,location.href).href;
    var done=function(){say('Đã sao chép link');},fail=function(){say(fallbackCopy(url)?'Đã sao chép link':url);};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done,fail);}else{fail();}
  });

  render();
})();
</script>
</body>
</html>
